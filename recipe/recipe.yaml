# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.3.23.2"

package:
  name: types-cryptography
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/types-cryptography/types-cryptography-${{ version }}.tar.gz
  sha256: 09cc53f273dd4d8c29fa7ad11fefd9b734126d467960162397bc5e3e604dea75

build:
  number: 2
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - python >=${{ python_min }}
    - types-enum34
    - types-ipaddress

tests:
  - package_contents:
      site_packages:
        - cryptography-stubs/__init__.pyi
  - python:
      imports: []
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://github.com/python/typeshed
  repository: https://github.com/python/typeshed
  summary: Typing stubs for cryptography
  license: Apache-2.0 AND MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - fhoehle
    - conda-forge/mypy
